# fail2ban filter for pvai's direct access (installed as
# /etc/fail2ban/filter.d/pvai.conf). The daemon writes one line per refused
# connection to the system log, ident "pvai", facility auth:
#   rejected <address>: unknown device | no client certificate |
#     handshake failed | handshake timed out | no pairing window |
#     bad proof | pairing timed out

[INCLUDES]
before = common.conf

[Definition]
_daemon = pvai
failregex = ^%(__prefix_line)srejected <HOST>: 
ignoreregex =

# backend = systemd reads the journal for this ident.
journalmatch = SYSLOG_IDENTIFIER=pvai
