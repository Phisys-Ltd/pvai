# fail2ban jail for pvai's direct access (installed as
# /etc/fail2ban/jail.d/pvai.conf), off until you turn it on:
#   sudo sed -i 's/^enabled = false/enabled = true/' /etc/fail2ban/jail.d/pvai.conf
#   sudo systemctl reload fail2ban
# pvai itself drops an address for a minute after 5 failures within a
# minute (doubling up to an hour); this bans it at the firewall for longer.

[pvai]
enabled = false
filter = pvai
port = 7471
protocol = tcp
backend = systemd
# Without the journal (rsyslog writing auth messages to a file):
# backend = auto
# logpath = /var/log/auth.log
maxretry = 5
findtime = 10m
bantime = 1h
